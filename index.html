<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>伴侣 AI — 桌面情绪伙伴</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 角色容器 -->
    <div id="companion" class="companion idle">
      <div class="companion-body">
        <div class="companion-face">
          <div class="eyes">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
          <div class="mouth"></div>
        </div>
        <div class="ears">
          <div class="ear left"></div>
          <div class="ear right"></div>
        </div>
      </div>
      <div class="bubble" id="bubble"></div>
    </div>

    <!-- 状态栏 -->
    <div id="status-bar">
      <span id="status-text">休息中</span>
      <span id="time-display"></span>
    </div>

    <!-- 对话框 -->
    <div id="chat-panel" class="hidden">
      <div id="chat-header">
        <span>和伴侣聊天</span>
        <button id="chat-close">×</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="说点什么..." />
        <button id="chat-send">发送</button>
      </div>
    </div>

    <!-- 音乐生成面板 -->
    <div id="music-panel" class="hidden">
      <div id="music-header">
        <span>生成音乐</span>
        <button id="music-close">×</button>
      </div>
      <div id="music-content">
        <div id="music-model-section">
          <label>
            音乐模型:
            <select id="music-model">
              <option value="music-2.6">music-2.6 (默认)</option>
              <option value="music-2.6-free">music-2.6-free (免费版)</option>
            </select>
          </label>
        </div>
        <div id="music-prompt-section">
          <textarea id="music-prompt" placeholder="描述你想生成的音乐... 如：欢快的钢琴曲"></textarea>
        </div>
        <button id="music-generate">生成</button>
        <div id="music-result"></div>
      </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="hidden">
      <h3>设置</h3>
      <label>
        AI 提供商:
        <select id="ai-provider">
          <option value="claude">Claude</option>
          <option value="minimax">MiniMax</option>
        </select>
      </label>
      <label id="claude-api-key-label">
        Claude API Key:
        <input type="password" id="api-key" placeholder="sk-..." />
      </label>
      <label id="minimax-api-key-label" style="display:none;">
        MiniMax API Key:
        <input type="password" id="minimax-api-key" placeholder="输入 MiniMax API Key" />
      </label>
      <label id="minimax-model-label" style="display:none;">
        MiniMax 模型:
        <select id="minimax-model">
          <option value="MiniMax-M2">MiniMax-M2 (默认)</option>
          <option value="MiniMax-M2.1">MiniMax-M2.1</option>
          <option value="MiniMax-M2.1-lightning">MiniMax-M2.1-lightning</option>
          <option value="MiniMax-M2.1-highspeed">MiniMax-M2.1-highspeed</option>
          <option value="MiniMax-M2.5">MiniMax-M2.5</option>
          <option value="MiniMax-M2.5-lightning">MiniMax-M2.5-lightning</option>
          <option value="MiniMax-M2.5-highspeed">MiniMax-M2.5-highspeed</option>
          <option value="MiniMax-M2.7">MiniMax-M2.7</option>
          <option value="MiniMax-M2.7-highspeed">MiniMax-M2.7-highspeed</option>
        </select>
      </label>
      <label>
        工作开始时间:
        <input type="time" id="work-start" value="09:00" />
      </label>
      <label>
        工作结束时间:
        <input type="time" id="work-end" value="22:00" />
      </label>
      <button id="save-settings">保存</button>
    </div>

    <!-- 唤起按钮 -->
    <button id="settings-btn">⚙️</button>
    <button id="music-btn" style="display:none;">🎵</button>
  </div>

  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
